name: Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest pyinstaller numpy matplotlib rich

      - name: Run Quality Gate Tests
        run: |
          python -m pytest -q

      - name: Compile Standalone Windows Executable
        run: |
          python compile_standalone_exe.py

      - name: Build Windows Setup Installer
        run: |
          python scripts/build_installer.py

      - name: Extract Tag Version
        id: get_version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "Metrology Workstation v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          files: |
            dist/Metrology-Workstation-v1.0.0-Windows-x64-Setup.exe
            dist/SHA256SUMS.txt
          body: |
            ## Metrology Workstation v${{ steps.get_version.outputs.VERSION }}

            Evidence-First Calibration, Measurement Uncertainty, and Conformity Assessment Platform.

            ### Release Deliverables
            - **Windows Installer**: `Metrology-Workstation-v${{ steps.get_version.outputs.VERSION }}-Windows-x64-Setup.exe`
            - **Checksum Manifest**: `SHA256SUMS.txt`

            ### Verification
            Verify the integrity of your download in PowerShell:
            ```powershell
            Get-FileHash .\Metrology-Workstation-v1.0.0-Windows-x64-Setup.exe -Algorithm SHA256
            ```

            ### System Requirements
            - Windows 10 (64-bit) / Windows 11
            - 4 GB RAM
            - 200 MB free disk space
            - 100% Offline Capable
