    // --- State & Audio Engines ---
    let currentTime = 0;
    let isPlaying = false;
    let voiceEnabled = true;
    let currentSceneIndex = -1;
    let playInterval = null;

    // Web Audio Sound FX Synthesizer
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.08) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    }

    // Web Speech API Voiceover
    function speakText(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.04;
      utterance.pitch = 0.95;
      
      // Try to find a high quality English voice
      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('David') || v.name.includes('George')) && v.lang.startsWith('en'));
      if (preferredVoice) utterance.voice = preferredVoice;

      window.speechSynthesis.speak(utterance);
    }

    // Render Scene at current time
    function updateScene() {
      const sceneIdx = scenes.findIndex(s => currentTime >= s.startTime && currentTime < s.endTime);
      if (sceneIdx !== -1 && sceneIdx !== currentSceneIndex) {
        currentSceneIndex = sceneIdx;
        const s = scenes[sceneIdx];
        
        // Sound cue on transition
        if (sceneIdx === 0) playTone(110, 1.2, 'sawtooth', 0.05); // sub-drone
        else if (sceneIdx === 2) playTone(220, 0.4, 'square', 0.04); // chaos
        else if (sceneIdx === 4) { playTone(440, 0.2, 'sine', 0.1); playTone(660, 0.4, 'triangle', 0.08); } // reveal
        else if (sceneIdx === 6) playTone(523, 0.5, 'sine', 0.1); // audit pass
        else playTone(330, 0.3, 'sine', 0.05);

        // Update DOM
        const stage = document.getElementById('stage');
        stage.innerHTML = `
          <div class="scene-content">
            <div class="act-tag">${s.act}</div>
            <h1 class="headline">${s.headline}</h1>
            <p class="subhead">${s.subhead}</p>
            <div class="visual-container">
              ${s.renderVisual()}
            </div>
          </div>
        `;

        document.getElementById('subtitles').innerHTML = s.voiceText;

        // Trigger voiceover
        if (isPlaying) {
          speakText(s.voiceText);
        }

        // Highlight chapter pills
        const pills = document.querySelectorAll('.chapter-pill');
        pills.forEach((p, idx) => {
          p.classList.toggle('active', idx === Math.min(sceneIdx, pills.length - 1));
        });
      }

      // Update progress bar & time display
      const pct = (currentTime / TOTAL_DURATION) * 100;
      document.getElementById('progressFill').style.width = pct + '%';

      const mins = Math.floor(currentTime / 60);
      const secs = Math.floor(currentTime % 60).toString().padStart(2, '0');
      document.getElementById('timeDisplay').innerText = `${mins}:${secs} / 2:45`;
    }

    // Playback loop
    function startPlayback() {
      if (playInterval) clearInterval(playInterval);
      isPlaying = true;
      document.getElementById('playBtn').innerHTML = '&#10074;&#10074;';
      
      const s = scenes[currentSceneIndex] || scenes[0];
      if (s) speakText(s.voiceText);

      playInterval = setInterval(() => {
        currentTime += 0.5;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          pausePlayback();
        }
        updateScene();
      }, 500);
    }

    function pausePlayback() {
      if (playInterval) clearInterval(playInterval);
      isPlaying = false;
      document.getElementById('playBtn').innerHTML = '&#9654;';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function togglePlay() {
      if (isPlaying) pausePlayback();
      else {
        if (currentTime >= TOTAL_DURATION) currentTime = 0;
        startPlayback();
      }
    }

    function seekTo(seconds) {
      currentTime = seconds;
      currentSceneIndex = -1;
      updateScene();
      if (isPlaying) {
        startPlayback();
      }
    }

    // Event Listeners
    document.getElementById('playBtn').addEventListener('click', togglePlay);

    document.getElementById('progressTrack').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clickX / rect.width;
      seekTo(ratio * TOTAL_DURATION);
    });

    document.getElementById('voiceToggle').addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voiceStatus').innerText = voiceEnabled ? 'ON' : 'MUTED';
      document.getElementById('voiceToggle').classList.toggle('active', voiceEnabled);
      if (!voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      } else if (voiceEnabled && isPlaying) {
        const s = scenes[currentSceneIndex];
        if (s) speakText(s.voiceText);
      }
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      const frame = document.getElementById('videoFrame');
      if (!document.fullscreenElement) {
        frame.requestFullscreen?.() || frame.webkitRequestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });

    // Initialize first scene
    updateScene();
  </script>
